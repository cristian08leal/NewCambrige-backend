<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebColegios Bot — Panel de Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--surface:#0d1424;--card:#111827;--border:#1e2d45;
  --text:#e2e8f0;--muted:#64748b;--blue:#3b82f6;--blue-dim:#1d4ed8;
  --purple:#8b5cf6;--purple-dim:#5b21b6;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;
  --radius:14px;--font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* NAV */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:60px;
  background:rgba(13,20,36,.8);border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);flex-shrink:0;z-index:10;
}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--blue),var(--purple))}
.nav-icon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.nav-title{font-size:1rem;font-weight:700;letter-spacing:-.3px;color:#fff}
.nav-title span{color:var(--blue)}
#status-badge{
  padding:5px 14px;border-radius:20px;font-size:.75rem;font-weight:600;
  background:#1e2d45;color:var(--muted);letter-spacing:.5px;transition:.3s;
}
#status-badge.running{background:rgba(59,130,246,.15);color:var(--blue);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* LAYOUT */
main{display:grid;grid-template-columns:280px 1fr;gap:0;flex:1;overflow:hidden}

/* SIDEBAR */
aside{
  padding:20px;display:flex;flex-direction:column;gap:14px;
  border-right:1px solid var(--border);overflow-y:auto;background:var(--surface);
}
.section-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:4px}

/* SCRAPE CARDS */
.scrape-card{
  border-radius:var(--radius);border:1px solid var(--border);padding:16px;cursor:pointer;
  transition:.25s;position:relative;overflow:hidden;text-align:left;width:100%;
  background:var(--card);
}
.scrape-card:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.scrape-card:active:not(:disabled){transform:translateY(0)}
.scrape-card:disabled{opacity:.45;cursor:not-allowed}
.scrape-card::before{
  content:'';position:absolute;inset:0;opacity:.06;
  background:radial-gradient(circle at 80% 20%,currentColor,transparent 70%);
  pointer-events:none;
}
.sc-est{color:var(--blue)}
.sc-est:hover:not(:disabled){border-color:rgba(59,130,246,.4)}
.sc-doc{color:var(--purple)}
.sc-doc:hover:not(:disabled){border-color:rgba(139,92,246,.4)}
.sc-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sc-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.sc-est .sc-icon{background:rgba(59,130,246,.15)}
.sc-doc .sc-icon{background:rgba(139,92,246,.15)}
.sc-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.sc-name{font-size:.9rem;font-weight:700;color:#fff}
.sc-desc{font-size:.72rem;color:var(--muted);line-height:1.5}
.sc-spinner{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-left:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.sc-card-running .sc-spinner{display:block}

/* STATS */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:1.4rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}

/* DATA TABS */
.tab-row{display:flex;gap:6px}
.tab-btn{
  flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--muted);font-size:.75rem;font-weight:600;
  cursor:pointer;transition:.2s;
}
.tab-btn:hover{background:#1a2640;color:var(--text)}
.tab-btn.active-est{border-color:rgba(59,130,246,.5);color:var(--blue);background:rgba(59,130,246,.08)}
.tab-btn.active-doc{border-color:rgba(139,92,246,.5);color:var(--purple);background:rgba(139,92,246,.08)}

/* RIGHT PANEL */
.right{display:flex;flex-direction:column;gap:0;overflow:hidden}

/* TERMINAL */
.terminal-wrap{
  flex:0 0 48%;display:flex;flex-direction:column;
  border-bottom:1px solid var(--border);
}
.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;
}
.panel-title{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:5px}
.dot{width:10px;height:10px;border-radius:50%}
.dot-r{background:#ef4444}.dot-y{background:#f59e0b}.dot-g{background:#22c55e}
.term-body{
  flex:1;padding:14px 16px;font-family:var(--mono);font-size:.73rem;line-height:1.7;
  overflow-y:auto;background:#05090f;
}
.term-body::-webkit-scrollbar{width:6px}
.term-body::-webkit-scrollbar-track{background:transparent}
.term-body::-webkit-scrollbar-thumb{background:#1e2d45;border-radius:3px}
.t-info{color:#93c5fd}.t-warn{color:#fcd34d}.t-err{color:#fca5a5;font-weight:600}
.t-ok{color:#86efac}.t-dim{color:#334155}.t-white{color:#e2e8f0}
.cursor{display:inline-block;width:8px;height:13px;background:var(--blue);animation:blink 1.1s step-end infinite;vertical-align:text-bottom;border-radius:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* DATA TABLE */
.table-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tbl-header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#table-title{font-size:.85rem;font-weight:700;color:#fff}
.tbl-meta{display:flex;align-items:center;gap:10px}
#row-count{font-size:.7rem;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:3px 10px;border-radius:20px}
.reload-btn{
  width:28px;height:28px;border-radius:7px;border:1px solid var(--border);
  background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.2s;
}
.reload-btn:hover{background:#1a2640;color:var(--text)}
.reload-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.tbl-scroll{flex:1;overflow:auto}
.tbl-scroll::-webkit-scrollbar{width:6px;height:6px}
.tbl-scroll::-webkit-scrollbar-track{background:transparent}
.tbl-scroll::-webkit-scrollbar-thumb{background:#1e2d45;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:.75rem}
thead th{
  padding:9px 14px;background:var(--surface);color:var(--muted);
  font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  position:sticky;top:0;white-space:nowrap;border-bottom:1px solid var(--border);
}
tbody tr{border-bottom:1px solid rgba(30,45,69,.5);transition:background .15s}
tbody tr:hover{background:rgba(59,130,246,.04)}
tbody td{padding:9px 14px;color:var(--text);white-space:nowrap}
tbody td.null-val{color:var(--muted);font-style:italic}
.badge-grade{
  display:inline-block;padding:2px 8px;border-radius:5px;font-size:.65rem;font-weight:600;
  background:rgba(139,92,246,.15);color:#c4b5fd;border:1px solid rgba(139,92,246,.25);
}
.badge-curso{
  display:inline-block;padding:2px 8px;border-radius:5px;font-size:.65rem;font-weight:600;
  background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.2);
}
.empty-state{padding:40px;text-align:center;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    </div>
    <span class="nav-title">Web<span>Colegios</span> Bot</span>
  </div>
  <div id="status-badge">● INACTIVO</div>
</nav>

<main>
  <aside>
    <div>
      <div class="section-label">Iniciar Scraping</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">

        <button class="scrape-card sc-est" id="btn-est" onclick="iniciarScraping('estudiantes')">
          <div class="sc-header">
            <div class="sc-icon">
              <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
            </div>
            <span class="sc-name">Estudiantes</span>
            <div class="sc-spinner"></div>
          </div>
          <div class="sc-desc">Extrae el listado completo de alumnos activos (Escuela Nueva) e inserta en PostgreSQL.</div>
        </button>

        <button class="scrape-card sc-doc" id="btn-doc" onclick="iniciarScraping('docentes')">
          <div class="sc-header">
            <div class="sc-icon">
              <svg viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
            </div>
            <span class="sc-name">Docentes</span>
            <div class="sc-spinner"></div>
          </div>
          <div class="sc-desc">Descarga PDFs por grado → extrae titulares. Luego obtiene listado general de docentes con código.</div>
        </button>

      </div>
    </div>

    <div>
      <div class="section-label">Base de Datos</div>
      <div class="stats-row" style="margin-top:8px">
        <div class="stat-box">
          <div class="stat-num" id="stat-est">—</div>
          <div class="stat-lbl">Estudiantes</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="stat-doc">—</div>
          <div class="stat-lbl">Docentes</div>
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">Ver Tabla</div>
      <div class="tab-row" style="margin-top:8px">
        <button class="tab-btn" id="tab-est" onclick="cargarDatos('estudiantes')">Estudiantes</button>
        <button class="tab-btn" id="tab-doc" onclick="cargarDatos('docentes')">Docentes</button>
      </div>
    </div>
  </aside>

  <div class="right">
    <!-- TERMINAL -->
    <div class="terminal-wrap">
      <div class="panel-header">
        <div class="panel-title">
          <div class="dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
          bot.log — Terminal
        </div>
        <span style="font-size:.65rem;color:var(--muted);font-family:var(--mono)" id="log-time"></span>
      </div>
      <div class="term-body" id="terminal">
        <div class="t-info">WebColegios Bot Engine v3.0</div>
        <div class="t-dim">Esperando comandos...<span class="cursor"></span></div>
      </div>
    </div>

    <!-- DATA TABLE -->
    <div class="table-wrap">
      <div class="tbl-header">
        <span id="table-title">Vista de Datos</span>
        <div class="tbl-meta">
          <span id="row-count">0 registros</span>
          <button class="reload-btn" onclick="recargarDatos()" title="Recargar">
            <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
          </button>
        </div>
      </div>
      <div class="tbl-scroll">
        <table>
          <thead id="table-head"><tr><th>Selecciona una tabla</th></tr></thead>
          <tbody id="table-body"><tr><td class="empty-state">Sin datos. Selecciona Estudiantes o Docentes.</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
let currentLine = 0;
let pollingInterval = null;
let activeTab = null;

/* ── Utilidades ── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function colorear(l){
  l = esc(l).replace(/\n/g,'');
  if(/\[ERROR\]|❌/.test(l)) return `<div class="t-err">${l}</div>`;
  if(/\[WARNING\]|⚠️/.test(l)) return `<div class="t-warn">${l}</div>`;
  if(/✅|✔|finalizado/.test(l)) return `<div class="t-ok">${l}</div>`;
  if(/\[INFO\]/.test(l)) return `<div class="t-info">${l}</div>`;
  return `<div class="t-white">${l}</div>`;
}

/* ── Logs ── */
async function pollLogs(){
  try{
    const r = await fetch(`/api/logs?line=${currentLine}`);
    const d = await r.json();
    if(d.logs && d.logs.length){
      const term = document.getElementById('terminal');
      // Remove cursor if present
      const cur = term.querySelector('.cursor');
      const curParent = cur ? cur.parentElement : null;
      d.logs.forEach(l => { term.insertAdjacentHTML('beforeend', colorear(l)); });
      currentLine = d.next_line;
      term.scrollTop = term.scrollHeight;
      document.getElementById('log-time').textContent = new Date().toLocaleTimeString('es');
    }
  } catch(e){}
}

/* ── Status ── */
async function updateStatus(){
  try{
    const r = await fetch('/api/status');
    const s = await r.json();
    const badge = document.getElementById('status-badge');
    const bEst  = document.getElementById('btn-est');
    const bDoc  = document.getElementById('btn-doc');

    if(s.running){
      badge.textContent = `● SCRAP. ${s.tipo.toUpperCase()}`;
      badge.className = 'running';
      bEst.disabled = bDoc.disabled = true;
      bEst.classList.toggle('sc-card-running', s.tipo==='estudiantes');
      bDoc.classList.toggle('sc-card-running', s.tipo==='docentes');
      if(!pollingInterval) pollingInterval = setInterval(pollLogs, 1000);
    } else {
      badge.textContent = '● INACTIVO';
      badge.className = '';
      bEst.disabled = bDoc.disabled = false;
      bEst.classList.remove('sc-card-running');
      bDoc.classList.remove('sc-card-running');
      if(pollingInterval){
        clearInterval(pollingInterval);
        pollingInterval = null;
        pollLogs();
        actualizarStats();
        if(activeTab) cargarDatos(activeTab);
      }
    }
  } catch(e){}
}

/* ── Stats ── */
async function actualizarStats(){
  try{
    const r = await fetch('/api/stats');
    const d = await r.json();
    document.getElementById('stat-est').textContent = d.estudiantes ?? '—';
    document.getElementById('stat-doc').textContent = d.docentes ?? '—';
  } catch(e){}
}

/* ── Iniciar scraping ── */
async function iniciarScraping(tipo){
  try{
    const term = document.getElementById('terminal');
    term.innerHTML = `<div class="t-warn">▶ Iniciando scraping de ${tipo}...</div><div class="t-dim"><span class="cursor"></span></div>`;
    currentLine = 0;
    const r = await fetch(`/api/scrape/${tipo}`, {method:'POST'});
    const d = await r.json();
    if(d.status === 'ok'){
      updateStatus();
    } else {
      term.insertAdjacentHTML('beforeend', `<div class="t-err">✗ ${esc(d.message)}</div>`);
    }
  } catch(e){
    document.getElementById('terminal').insertAdjacentHTML('beforeend','<div class="t-err">Error al contactar el servidor.</div>');
  }
}

/* ── Tabla de datos ── */
const COLS_EST = ['id','documento','nombre','grado_texto','curso','titular'];
const COLS_DOC = ['id','documento','nombre','grado_titular','curso_titular'];

async function cargarDatos(tipo){
  activeTab = tipo;
  document.getElementById('table-title').textContent = tipo === 'estudiantes' ? 'Estudiantes' : 'Docentes';
  document.getElementById('tab-est').className = 'tab-btn' + (tipo==='estudiantes'?' active-est':'');
  document.getElementById('tab-doc').className = 'tab-btn' + (tipo==='docentes'?' active-doc':'');
  document.getElementById('table-body').innerHTML = '<tr><td class="empty-state">Cargando...</td></tr>';

  try{
    const r = await fetch(`/api/data/${tipo}`);
    const d = await r.json();
    const data = d.data || [];
    document.getElementById('row-count').textContent = `${data.length} registros`;

    if(!data.length){
      document.getElementById('table-head').innerHTML='<tr><th>Sin datos</th></tr>';
      document.getElementById('table-body').innerHTML='<tr><td class="empty-state">No hay registros en la base de datos.</td></tr>';
      return;
    }

    const cols = tipo === 'estudiantes' ? COLS_EST : COLS_DOC;
    const labels = {
      id:'#', documento:'Documento', nombre:'Nombre completo',
      grado_texto:'Grado', curso:'Curso', titular:'Titular',
      grado_titular:'Grado Titular', curso_titular:'Curso',
    };

    let head = '<tr>';
    cols.forEach(c => { head += `<th>${labels[c]||c}</th>`; });
    head += '</tr>';
    document.getElementById('table-head').innerHTML = head;

    let body = '';
    data.forEach(row => {
      body += '<tr>';
      cols.forEach(c => {
        const val = row[c];
        if(val === null || val === undefined || val === ''){
          body += `<td class="null-val">—</td>`;
        } else if(c === 'grado_texto' || c === 'grado_titular'){
          body += `<td><span class="badge-grade">${esc(val)}</span></td>`;
        } else if(c === 'curso' || c === 'curso_titular'){
          body += `<td><span class="badge-curso">${esc(val)}</span></td>`;
        } else {
          body += `<td>${esc(val)}</td>`;
        }
      });
      body += '</tr>';
    });
    document.getElementById('table-body').innerHTML = body;
  } catch(e){
    document.getElementById('table-body').innerHTML='<tr><td class="empty-state t-err">Error cargando datos.</td></tr>';
  }
}

function recargarDatos(){
  if(activeTab) cargarDatos(activeTab);
}

/* ── Init ── */
setInterval(updateStatus, 2000);
updateStatus();
actualizarStats();
setInterval(actualizarStats, 30000);
</script>
</body>
</html>
